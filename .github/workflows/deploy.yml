name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.419'

      - name: Force .NET 8 SDK
        run: |
          dotnet new globaljson --sdk-version 8.0.419 --force
          dotnet --version

      - name: Restore workloads
        run: dotnet workload restore AlienFarmHeist.csproj

      - name: Restore
        run: dotnet restore AlienFarmHeist.csproj

      - name: Publish
        run: dotnet publish AlienFarmHeist.csproj -c Release -o release --no-restore --nologo

      - name: Fix base href for GitHub Pages
        run: |
          sed -i 's#<base href="/" />#<base href="/${{ github.event.repository.name }}/" />#g' release/wwwroot/index.html

      - name: Add .nojekyll
        run: touch release/wwwroot/.nojekyll

      - name: Copy index.html to 404.html
        run: cp release/wwwroot/index.html release/wwwroot/404.html

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: release/wwwroot
          publish_branch: gh-pages